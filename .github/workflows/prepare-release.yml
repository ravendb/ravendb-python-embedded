name: Prepare release PR

# Step 1 of the release flow.
# Manually triggered. Bumps the version across setup.py / requirements.txt and
# opens a PR labelled `release`. Merging that PR fires `publish.yml`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 7.2.2 (sets package version, bundled RavenDB server version, and the ravendb client pin)."
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/^RAVENDB_VERSION = \".*\"/RAVENDB_VERSION = \"${VERSION}\"/" setup.py
          sed -i -E "s/version=\"[0-9][^\"]*\"/version=\"${VERSION}\"/" setup.py
          sed -i -E "s/ravendb~=[0-9][^\"]*/ravendb~=${VERSION}/" setup.py
          sed -i -E "s/^ravendb~=.*/ravendb~=${VERSION}/" requirements.txt

          echo "----- setup.py -----"
          grep -nE 'RAVENDB_VERSION|version=|ravendb~=' setup.py || true
          echo "----- requirements.txt -----"
          cat requirements.txt

          if git diff --quiet; then
            echo "::error::No version strings changed. Check the sed patterns against setup.py / requirements.txt."
            exit 1
          fi

      - name: Create release PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: ${{ github.event.repository.default_branch }}
          branch: release/${{ inputs.version }}
          delete-branch: true
          commit-message: "Release ${{ inputs.version }}"
          title: "Release ${{ inputs.version }}"
          labels: release
          body: |
            Automated release for **ravendb-embedded ${{ inputs.version }}**.

            Bumps `setup.py` (package version, `RAVENDB_VERSION`, `ravendb` pin) and `requirements.txt`.

            > [!WARNING]
            > Merging this PR **while the `release` label is set** triggers the
            > **Publish to PyPI** workflow, which builds and uploads the package and
            > creates the `v${{ inputs.version }}` GitHub release.

            Review the diff (adjust manually if the server version must differ from the
            package version), then merge to publish. Remove the `release` label before
            merging if you do **not** want to publish.
